services:
  - type: web
    name: adora-backend
    plan: free
    runtime: python
    runtimeVersion: 3.11.7
    buildCommand: bash build.sh
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: PIP_NO_CACHE_DIR
        value: "1"
      - key: PIP_NO_BUILD_ISOLATION
        value: "1"
      - key: DATABASE_URL
        value: sqlite:///./adora.db
      - key: ADMIN_EMAIL
        value: admin@adora.com
      - key: ADMIN_PASSWORD
        value: admin123456
    healthCheckPath: /api/health
    maxShutdownDelay: 30
